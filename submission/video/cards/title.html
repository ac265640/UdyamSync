<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { background: #0f5e6e; color: #f6f1e7; }
  .wrap { position: absolute; left: 190px; top: 300px; }
  .mark { display: flex; align-items: center; gap: 36px; }
  .logo { width: 150px; height: 150px; border-radius: 34px; background: #f6f1e7; position: relative; }
  .logo i { position: absolute; left: 30px; height: 14px; border-radius: 9px; background: #0f5e6e; }
  .logo .d { position: absolute; right: 26px; bottom: 26px; width: 34px; height: 34px; border-radius: 50%; background: #d9950b; }
  .name { font-size: 170px; font-weight: 500; }
  .tag { margin-top: 40px; font-size: 76px; font-style: italic; font-weight: 400; color: #f2d48f; }
  .margin { background: rgba(246,241,231,.4); box-shadow: 6px 0 0 rgba(246,241,231,.2); }
  .foot { color: rgba(246,241,231,.7); }
</style></head><body>
<div class="margin"></div>
<div class="wrap">
  <div class="mark"><div class="logo" id="logo"><i style="top:38px;width:90px"></i><i style="top:68px;width:90px"></i><i style="top:98px;width:56px"></i><span class="d"></span></div><div class="name serif" id="name">UdyamSync</div></div>
  <div class="tag serif" id="tag">Get your business online, in one sitting.</div>
</div>
<div class="foot"><span>Airtel SYNC 2026 · Enterprise Track A</span><span>Project Udyam Digital</span></div>
<script src="../../../frontend/node_modules/gsap/dist/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } })
  tl.from('#logo', { scale: 0.6, opacity: 0, rotate: -8, duration: 0.7, ease: 'back.out(1.6)' }, 0.1)
    .from('#logo i', { scaleX: 0, transformOrigin: 'left', stagger: 0.12, duration: 0.45 }, 0.35)
    .from('#name', { opacity: 0, x: -40, filter: 'blur(10px)', duration: 0.8 }, 0.45)
    .from('#tag', { opacity: 0, y: 30, duration: 0.8 }, 1.7)
    .from('.foot', { opacity: 0, duration: 0.6 }, 2.2)
  window.seek = (t) => { tl.seek(t, false) }
</script></body></html>
