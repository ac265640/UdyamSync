<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .big { position: absolute; left: 190px; top: 190px; font-size: 168px; line-height: .95; font-weight: 500; }
  .big em { font-style: italic; color: var(--khata); font-weight: 400; }
  .sub { position: absolute; left: 196px; top: 560px; font-size: 56px; font-weight: 400; }
  .not { position: absolute; left: 196px; top: 660px; font-size: 40px; color: var(--muted); font-style: italic; }
  .stats { position: absolute; left: 196px; top: 760px; display: flex; gap: 70px; }
  .stat b { display: block; font-size: 84px; font-weight: 500; }
  .stat span { font-size: 26px; color: var(--muted); }
  .stat.red b { color: var(--khata); }
  .src { position: absolute; right: 120px; top: 120px; font-size: 22px; color: var(--muted); text-align: right; line-height: 1.5; }
</style></head><body>
<div class="margin"></div>
<div class="src">Accel SMB funnel<br>Apr–Jun 2026 · 5,000 leads</div>
<div class="big serif"><span id="n1">93</span> of every 100<br><em id="l2">never get switched on.</em></div>
<div class="sub serif" id="sub">Not for lack of demand.</div>
<div class="not" id="not">The journey loses them.</div>
<div class="stats">
  <div class="stat" id="st1"><b class="serif">17.6 days</b><span>from lead to live</span></div>
  <div class="stat" id="st2"><b class="serif">3 calls</b><span>chasing their order</span></div>
  <div class="stat red" id="st3"><b class="serif">₹15,053</b><span>to win each one</span></div>
</div>
<div class="foot"><span>The problem</span><span>Accel UdyamSync</span></div>
<script src="../../../frontend/node_modules/gsap/dist/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } })
  const n = { v: 0 }
  tl.from('.margin', { scaleY: 0, duration: 0.8, ease: 'power2.inOut' }, 0)
    .from('.big', { opacity: 0, y: 40, filter: 'blur(10px)', duration: 0.9 }, 0.15)
    .to(n, { v: 93, duration: 1.6, ease: 'power2.out', onUpdate: () => (document.getElementById('n1').textContent = Math.round(n.v)) }, 0.15)
    .from('#l2', { opacity: 0, x: -30, duration: 0.7 }, 2.4)
    .from('#sub', { opacity: 0, y: 24, filter: 'blur(8px)', duration: 0.6 }, 5.0)
    .from('#not', { opacity: 0, y: 18, duration: 0.6 }, 6.2)
    .from('#st1', { opacity: 0, y: 30, duration: 0.6 }, 8.9)
    .from('#st2', { opacity: 0, y: 30, duration: 0.6 }, 10.6)
    .from('#st3', { opacity: 0, y: 30, scale: 1.08, duration: 0.6 }, 12.0)
    .to('.big', { scale: 1.02, transformOrigin: 'left top', duration: 15, ease: 'none' }, 0)
  window.seek = (t) => { tl.seek(t, false) }
</script></body></html>
